name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-test:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1.9.2
        with:
          # Its RPC cache key ends in the commit sha, so every run saved a new
          # cache no later run could hit; the fork tests that would use it are
          # skipped below anyway.
          cache: false

      - name: Build
        run: forge build

      - name: Unit tests
        run: forge test --no-match-path 'test/fork/*' -vv
