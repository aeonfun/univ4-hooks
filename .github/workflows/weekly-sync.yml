name: weekly-sync

# Once a week, backfill in-repo Solidity source for any listed hook that only has
# a registry entry. scripts/sync_source.py reads each hooks/<slug>.json, and for
# any listing with no matching src/<Name>.sol it pulls the verified source from
# the chain explorer (by the address in the JSON) and vendors it, plus the rest of
# its verified build under src/vendor/<Name>/. --verify drops any hook that does
# not compile here (logged as a warning), so one bad listing cannot turn this red.
# If anything was added it force-pushes the one bot branch chore/source-sync and
# opens a PR from it, or updates the PR already open there, so there is never more
# than one sync PR. A quiet week, or a week whose result matches what that branch
# already holds, is a no-op. Never merges on its own.
#
# Token: a PR or push made with GITHUB_TOKEN does not trigger other workflows, so
# the required ci / build-test check would never run on the sync PR. Set the repo
# secret GH_GLOBAL (classic PAT, `repo` scope, same convention as the other aeonfun
# automation) and the push + PR go out under it, so CI runs. Without it this falls
# back to GITHUB_TOKEN and CI has to be started by hand on the PR.

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # the push below goes out with this token; GITHUB_TOKEN pushes trigger no CI
          token: ${{ secrets.GH_GLOBAL || secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1.9.2

      - name: Sync source for listings that have none
        env:
          # etherscan-family chains (all but Robinhood) need this; Robinhood is keyless.
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
        run: python3 scripts/sync_source.py --write --verify

      - name: Anything to open?
        id: diff
        run: |
          if [ -n "$(git status --porcelain src lib)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No new source to sync this week."
          fi

      - name: Verify it compiles
        if: steps.diff.outputs.changed == 'true'
        run: forge build

      - name: Open or update the sync PR
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_GLOBAL || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # one fixed, bot-owned branch: rebuilt from main each run and force-pushed
          branch="chore/source-sync"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add src
          git commit -F - <<'EOF'
          chore: sync verified source for listed hooks

          Backfilled by scripts/sync_source.py from the chain explorers. See the PR
          body for which listings and libraries were added.
          EOF
          # same tree as the branch already holds: nothing new, leave the PR (and its CI) alone
          if git fetch --depth=1 origin "$branch" 2>/dev/null \
            && git diff --quiet FETCH_HEAD HEAD; then
            echo "chore/source-sync already holds this sync, nothing to push."
            exit 0
          fi
          git push --force origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "chore: weekly hook source sync" \
            --body-file sync_summary.md \
            || gh pr edit "$branch" --body-file sync_summary.md
