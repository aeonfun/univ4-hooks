name: analyze-hook

# When someone opens a "Submit a hook" issue, decode the flags from the address,
# scaffold hooks/<slug>.json, regenerate the registry, and open a PR for review.
# Everything here is keyless: the v4 flags come straight from the address, so no
# block-explorer API key is needed.

on:
  issues:
    types: [opened]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  scaffold:
    if: contains(join(github.event.issue.labels.*.name, ','), 'hook-submission')
    runs-on: ubuntu-latest
    env:
      ISSUE: ${{ github.event.issue.number }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt

      - name: Acknowledge the submission
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue comment "$ISSUE" --body "Thanks for the submission! Decoding the v4 flags from the address and scaffolding the listing now. [Follow the run]($RUN_URL)."

      - name: Scaffold hook JSON from the issue
        id: scaffold
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          # Optional: enables auto-filling the name from verified source on
          # etherscan-family chains. Blockscout (Robinhood) works without it.
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
        run: |
          set -euo pipefail
          path="$(python3 scripts/from_issue.py)"
          echo "path=$path" >> "$GITHUB_OUTPUT"

      - name: Regenerate registry + validate
        run: |
          set -euo pipefail
          python3 scripts/aggregate.py
          python3 scripts/validate.py

      - name: Open a PR
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PATHFILE: ${{ steps.scaffold.outputs.path }}
        run: |
          set -euo pipefail
          slug="$(basename "$PATHFILE" .json)"
          branch="hook-submission/${slug}-${ISSUE}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add hooks/ hooklist.json HOOKS.md
          git commit -F - <<EOF
          feat: scaffold ${slug} hook from #${ISSUE}

          Flags decoded from the address. Prose/tags need a maintainer pass before merge.
          Closes #${ISSUE}
          EOF
          git push -u origin "$branch"

          {
            echo "Auto-scaffolded from #${ISSUE}. The v4 flags and callbacks are decoded from the address and checked by CI; a maintainer fills the prose before merge."
            echo
            cat submission_summary.md
            echo
            echo "**Maintainer checklist**"
            echo "- [ ] Name reads right"
            echo "- [ ] Category and class are correct"
            echo "- [ ] \`mechanic\` set (one-line tile summary)"
            echo "- [ ] \`plain\` set (modal explainer)"
            echo "- [ ] \`rules\` set (one per line)"
            echo
            echo "Closes #${ISSUE}"
          } > pr_body.md

          url="$(gh pr create --base main --head "$branch" \
            --label hook-submission \
            --title "hook: ${slug} (from #${ISSUE})" \
            --body-file pr_body.md)"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Comment on the issue
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ steps.pr.outputs.url }}
        run: |
          set -euo pipefail
          {
            echo "Decoded the flags and opened $PR_URL for review. A maintainer fills in the prose, then it lists on [aeon.fun/hooks](https://www.aeon.fun/hooks)."
            echo
            cat submission_summary.md
          } > issue_comment.md
          gh issue comment "$ISSUE" --body-file issue_comment.md

      - name: Report failure on the issue
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue comment "$ISSUE" --body "Could not auto-scaffold this submission - the chain or address may be off, or a field needs a fix. A maintainer will take it from here. [See the run]($RUN_URL) for details."
