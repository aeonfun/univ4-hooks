name: hooklist

on:
  push:
    branches: [main]
    paths:
      - "hooks/**"
      - "schema.json"
      - "chains.json"
      - "scripts/**"
      - "hooklist.json"
      - "HOOKS.md"
      - ".github/workflows/hooklist.yml"
  pull_request:
    paths:
      - "hooks/**"
      - "schema.json"
      - "chains.json"
      - "scripts/**"
      - "hooklist.json"
      - "HOOKS.md"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  validate:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Validate hooks against schema + flag invariant
        run: python3 scripts/validate.py
      - name: hooklist.json + HOOKS.md are up to date
        run: python3 scripts/aggregate.py --check
      - name: sync_source unit tests
        run: python3 -m unittest discover -s scripts -p "test_*.py" -v
