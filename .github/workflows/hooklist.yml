name: hooklist

on:
  push:
    branches: [main]
    paths:
      - "hooks/**"
      - "schema.json"
      - "chains.json"
      - "scripts/**"
      - "hooklist.json"
      - "HOOKS.md"
      - ".github/workflows/hooklist.yml"
  pull_request:
    paths:
      - "hooks/**"
      - "schema.json"
      - "chains.json"
      - "scripts/**"
      - "hooklist.json"
      - "HOOKS.md"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Validate hooks against schema + flag invariant
        run: python3 scripts/validate.py
      - name: hooklist.json + HOOKS.md are up to date
        run: python3 scripts/aggregate.py --check
